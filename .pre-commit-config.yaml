# Pre-commit configuration for Data Pipeline Assistant
# This configuration ensures code quality for Oracle to dbt migration projects

repos:
  # General code quality and formatting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        description: Trim trailing whitespace
      - id: end-of-file-fixer
        description: Ensure files end with newline
      - id: check-yaml
        description: Validate YAML files
        files: \.(yaml|yml)$
      - id: check-json
        description: Validate JSON files
      - id: check-merge-conflict
        description: Check for merge conflict markers
      - id: check-added-large-files
        description: Prevent large files from being committed
        args: ['--maxkb=1000']
      - id: mixed-line-ending
        description: Ensure consistent line endings
        args: ['--fix=lf']

  # SQL formatting and linting with SQLFluff
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.4.1
    hooks:
      - id: sqlfluff-lint
        description: Lint SQL files with SQLFluff
        files: \.(sql)$
        args: ['--dialect=snowflake', '--config=.sqlfluff']
        additional_dependencies: ['dbt-snowflake', 'sqlfluff-templater-dbt']
      - id: sqlfluff-fix
        description: Fix SQL files with SQLFluff
        files: \.(sql)$
        args: ['--dialect=snowflake', '--config=.sqlfluff']
        additional_dependencies: ['dbt-snowflake', 'sqlfluff-templater-dbt']

  # Cleanup SQLFluff temporary files
  - repo: local
    hooks:
      - id: cleanup-sqlfluff-temp
        name: Cleanup SQLFluff temporary files
        entry: python scripts/cleanup_sqlfluff_temp.py
        language: system
        always_run: true
        pass_filenames: false

  # Python code formatting (for scripts and custom code)
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        description: Format Python code with Black
        language_version: python3
        files: \.(py)$

  # Python import sorting
  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort
        description: Sort Python imports
        files: \.(py)$
        args: ['--profile', 'black']

  # Python linting
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        description: Lint Python code with Flake8
        files: \.(py)$
        args: ['--max-line-length=150', '--extend-ignore=E203,W503,E501']

  # dbt-specific hooks (simplified for Oracle migration project)
  - repo: https://github.com/dbt-checkpoint/dbt-checkpoint
    rev: v2.0.7
    hooks:
      - id: check-script-has-no-table-name
        description: Ensure dbt scripts use {{ ref() }} and {{ source() }}
        files: dbt_project/models/.*\.sql$
      - id: check-macro-has-description
        description: Ensure all macros have descriptions
        files: dbt_project/macros/.*\.sql$
        exclude: dbt_project/macros/oracle_utils/.*\.sql$
      - id: dbt-deps
        description: Install dbt dependencies first
        stages: [manual]
      - id: dbt-compile
        description: Compile dbt project to check for errors
        stages: [manual]

  # Markdown formatting and linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        description: Lint Markdown files
        args: ['--config', '.markdownlint.json', '--fix']
  # Oracle PL/SQL specific checks (custom script)
  - repo: local
    hooks:
      - id: oracle-package-structure
        name: Check Oracle package structure
        entry: python scripts/validate_oracle_structure.py
        language: python
        files: oracle_packages/.*
        description: Validate Oracle package conversion structure
        additional_dependencies: ['pyyaml']

      - id: dbt-model-naming
        name: Check dbt model naming conventions
        entry: python scripts/validate_dbt_naming.py
        language: python
        files: dbt_project/models/.*\.sql$
        description: Ensure dbt models follow naming conventions

      - id: oracle-macro-coverage
        name: Check Oracle function macro coverage
        entry: python scripts/check_oracle_macro_coverage.py
        language: python
        files: dbt_project/models/.*\.sql$
        description: Ensure Oracle functions have corresponding dbt macros

  # Prettier for Markdown files
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: \.(md|markdown)$
        args: ["--write"]

# Configuration for specific file exclusions
exclude: |
  (?x)^(
    .*\.log|
    dbt_project/target/.*|
    dbt_project/dbt_packages/.*|
    .*\.pyc|
    .*__pycache__.*
  )$

# Fail fast - stop on first failure
fail_fast: false

# Default language version
default_language_version:
  python: python3
