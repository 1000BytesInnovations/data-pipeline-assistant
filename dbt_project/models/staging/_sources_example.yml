version: 2

sources:
  - name: raw_oracle
    description: "Raw data source from Oracle database migration"
    database: "{{ var('source_database') }}"
    schema: "{{ var('source_schema') }}"
    tables:
      - name: customers
        description: "Customer master data from Oracle"
        columns:
          - name: customer_id
            description: "Unique customer identifier"
            tests:
              - unique
              - not_null
          - name: customer_name
            description: "Customer full name"
            tests:
              - not_null
          - name: email
            description: "Customer email address"
          - name: created_date
            description: "Date customer record was created"
          - name: updated_date
            description: "Date customer record was last updated"

      - name: sales_data
        description: "Sales transaction data from Oracle"
        columns:
          - name: sale_id
            description: "Unique sale identifier"
            tests:
              - unique
              - not_null
          - name: customer_id
            description: "Foreign key to customers table"
            tests:
              - not_null
              - relationships:
                  to: source('raw_oracle', 'customers')
                  field: customer_id
          - name: sale_amount
            description: "Sale amount in base currency"
            tests:
              - not_null
          - name: sale_date
            description: "Date of sale transaction"
            tests:
              - not_null
