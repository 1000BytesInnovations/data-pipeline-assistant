version: 2

sources:
  - name: raw_data
    description: "Raw data imported from Oracle systems"
    database: "{{ var('source_database') }}"
    schema: "{{ var('source_schema', 'RAW_DATA') }}"
    tables:
      - name: sales_data
        description: "Raw sales transaction data from Oracle"
        columns:
          - name: transaction_id
            description: "Unique transaction identifier"
            tests:
              - unique
              - not_null
          - name: customer_id
            description: "Customer identifier"
            tests:
              - not_null
          - name: product_id
            description: "Product identifier"
          - name: transaction_date
            description: "Date of transaction"
            tests:
              - not_null
          - name: amount
            description: "Transaction amount"
            tests:
              - not_null
              - dbt_expectations.expect_column_values_to_be_between:
                  min_value: 0
                  max_value: 1000000
          - name: created_at
            description: "Record creation timestamp"
          - name: updated_at
            description: "Record last update timestamp"

      - name: customer_info
        description: "Customer master data from Oracle"
        columns:
          - name: customer_id
            description: "Unique customer identifier"
            tests:
              - unique
              - not_null
          - name: customer_name
            description: "Customer name"
          - name: customer_type
            description: "Type of customer (Individual, Corporate, etc.)"
          - name: registration_date
            description: "Customer registration date"
          - name: status
            description: "Customer status (Active, Inactive, etc.)"
          - name: created_at
            description: "Record creation timestamp"
          - name: updated_at
            description: "Record last update timestamp"

      - name: product_catalog
        description: "Product catalog from Oracle"
        columns:
          - name: product_id
            description: "Unique product identifier"
            tests:
              - unique
              - not_null
          - name: product_name
            description: "Product name"
          - name: category
            description: "Product category"
          - name: price
            description: "Product price"
          - name: created_at
            description: "Record creation timestamp"
          - name: updated_at
            description: "Record last update timestamp"
