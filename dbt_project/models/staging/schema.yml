version: 2

sources:
  - name: oracle_source
    description: "Source tables from Oracle database"
    database: "{{ var('oracle_database') }}"
    schema: "{{ var('oracle_schema') }}"
    tables:
      - name: customers
        description: "Customer master data"
        columns:
          - name: customer_id
            description: "Primary key for customer"
            tests:
              - unique
              - not_null
          - name: customer_name
            description: "Customer name"
            tests:
              - not_null
          - name: created_date
            description: "Record creation date"
          - name: updated_date
            description: "Record last update date"
            
      - name: orders
        description: "Order transactions"
        columns:
          - name: order_id
            description: "Primary key for order"
            tests:
              - unique
              - not_null
          - name: customer_id
            description: "Foreign key to customer"
            tests:
              - not_null
              - relationships:
                  to: source('oracle_source', 'customers')
                  field: customer_id
          - name: order_date
            description: "Order date"
          - name: order_amount
            description: "Order amount"

models:
  - name: stg_customers
    description: "Staging model for customers"
    columns:
      - name: customer_key
        description: "Surrogate key for customer"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Natural key for customer"
      - name: customer_name
        description: "Customer name"
      - name: is_active
        description: "Customer active status"
      - name: created_at
        description: "Record creation timestamp"
      - name: updated_at
        description: "Record update timestamp"
